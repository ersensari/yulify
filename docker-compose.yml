name: forgeloop-ai

services:
  portal:
    build: .
    image: forgeloop-ai-yulify:latest
    container_name: forgeloop-ai-yulify
    restart: unless-stopped
    # Docker's own init as PID 1: it collects the processes the agent's jobs and the terminal's shells
    # leave behind, which the portal never waits for and which would stay as zombies until a restart.
    init: true
    network_mode: host
    labels:
      forgeloop.managed: "true"
      forgeloop.project: "forgeloop-ai"
      forgeloop.resource: "yulify"
    volumes:
      # Database, pi's settings and packages, sessions. A named volume unless
      # PORTAL_DATA_DIR is set to an absolute path, which mounts that directory.
      - ${PORTAL_DATA_DIR:-portal-data}:/data
      # Certificates, when you have them. Empty by default.
      - ${PORTAL_TLS_DIR:-/dev/null}:/certs:ro
      # Workspaces pi works in. Read-write: the whole point is that it edits code,
      # so there is no default: a path nobody chose would be made and mounted empty.
      - ${WORKSPACES_DIR:?Set WORKSPACES_DIR to the folder on this host that holds your repositories}:/workspaces
      # Required for managed Browser/Voice add-ons and EXECUTOR=container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Must match container_name: managed voice shares this network namespace,
      # and the container executor translates its mounts to host paths through it.
      PORTAL_CONTAINER_NAME: forgeloop-ai-yulify
      # The existing browser is independent; preserve its profile and running instance.
      BROWSER_EXTERNAL: ${BROWSER_EXTERNAL:-false}
      # With host networking the portal binds PORT directly on the host.
      PORT: ${PORT:-4100}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      # The portal refuses to start without a password unless this is set, so an
      # empty or misspelt PORTAL_PASSWORD cannot quietly open the port. Set it
      # only for a portal behind a reverse proxy which authenticates already;
      # then nothing here stops whoever reaches the port.
      PORTAL_ALLOW_NO_PASSWORD: ${PORTAL_ALLOW_NO_PASSWORD:-}
      # Without a password the portal listens on 127.0.0.1 only, which a proxy on
      # this host reaches and one in another container does not. Set this to 1 for
      # that proxy; then nothing but the proxy's own login stands in the way.
      ALLOW_OPEN: ${ALLOW_OPEN:-}
      # Keeps logins valid across restarts; generate with: openssl rand -hex 32
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      # The time zone of the portal's clock, such as Europe/Berlin. It is UTC unless
      # this says otherwise, and the quiet hours of an agent's heartbeat and a
      # repeating routine's schedule are read on that clock.
      TZ: ${TZ:-UTC}
      # "skip" upgrades the database without the backup it is otherwise made first,
      # for a volume with no room for the copy. See docs/guide/upgrading.md.
      PORTAL_UPGRADE_BACKUP: ${PORTAL_UPGRADE_BACKUP:-}
      # host = pi runs in this container | container = one container per task
      EXECUTOR: ${EXECUTOR:-host}
      PI_IMAGE: ${PI_IMAGE:-forgeloop-ai-yulify-runner:latest}
      TASK_MEMORY_MB: ${TASK_MEMORY_MB:-2048}
      TASK_CPUS: ${TASK_CPUS:-2}
      TASK_PIDS_LIMIT: ${TASK_PIDS_LIMIT:-512}
      # Overrides only — left empty so pi's own settings.json (defaultProvider,
      # defaultModel) decides. Baking values in here made those unreachable.
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      # Client token minted by forgeloop-provider.
      PORTAL_ALLOWED_PROVIDERS: ${PORTAL_ALLOWED_PROVIDERS:-}
      FORGELOOP_SERVER_BEARER_TOKEN: ${FORGELOOP_SERVER_BEARER_TOKEN:-}
      PI_THINKING_LEVEL: ${PI_THINKING_LEVEL:-}
      # Provider keys, passed on to pi. For another provider, add its variable
      # here, or save the key under Settings -> Providers.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Serve the portal over TLS when both are given. Needed for the embedded
      # browser: the VNC client refuses to run unless every page above it is
      # secure.
      PORTAL_TLS_CERT: ${PORTAL_TLS_CERT:-}
      PORTAL_TLS_KEY: ${PORTAL_TLS_KEY:-}
      # Where a local llama.cpp server is listening. Host networking means the
      # box's own address works from inside the container unchanged.
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-}
      # Comma-separated llama.cpp model names whose prompt cache is kept on disk
      # between chats; the server needs --parallel 1 and a --slot-save-path.
      LLAMA_DISK_CACHE_MODELS: ${LLAMA_DISK_CACHE_MODELS:-}
      # Managed voice, when more than one GPU is in the box: the GPU index it uses
      # (as nvidia-smi lists them), and memory in MiB to keep free on it for
      # something else. Left empty, the card with the most room is used.
      VOICE_GPU: ${VOICE_GPU:-}
      VOICE_VRAM_RESERVE_MIB: ${VOICE_VRAM_RESERVE_MIB:-}
      # Streaming recognition over WebRTC (see docs/guide/voice.md). The media is UDP straight to this host, so a
      # firewall needs the port range open; the portal is host-networked, so nothing else has to be published.
      VOICE_STT_WEBRTC: ${VOICE_STT_WEBRTC:-}
      VOICE_RTC_PORT_MIN: ${VOICE_RTC_PORT_MIN:-}
      VOICE_RTC_PORT_MAX: ${VOICE_RTC_PORT_MAX:-}
      # An address the browser can reach this host on, where it is not on an interface (public IP behind NAT).
      VOICE_RTC_ADDRESSES: ${VOICE_RTC_ADDRESSES:-}
      # The languages you speak, such as en,tr: Whisper's guesses in any other language on noise are dropped.
      VOICE_STT_LANGUAGES: ${VOICE_STT_LANGUAGES:-}
      # forgeloop-ai-speech: speaker-diarized transcripts (/api/sessions/:id/speech/diarize). Empty = routes answer 503.
      SPEECH_URL: ${SPEECH_URL:-}
      # 1/true/on: tell which enrolled voice spoke each utterance (needs SPEECH_URL); empty = off
      VOICE_SPEAKER_ID: ${VOICE_SPEAKER_ID:-}
      # Telegram voice: messages are transcribed, the final answer is also spoken back. Empty = text only.
      TELEGRAM_STT_URL: ${TELEGRAM_STT_URL:-}
      TELEGRAM_STT_MODEL: ${TELEGRAM_STT_MODEL:-}
      # the zone the <now> block in front of each message is written in (server/src/pi/now-block.ts)
      PORTAL_TIMEZONE: ${PORTAL_TIMEZONE:-}
      # shared long-term memory (mem0-server, host network 127.0.0.1:3900) behind /api/mem0 (server/src/api/mem0.ts)
      MEM0_BEARER_TOKEN: ${MEM0_BEARER_TOKEN:-}
      TELEGRAM_TTS_URL: ${TELEGRAM_TTS_URL:-}
      TELEGRAM_TTS_VOICE: ${TELEGRAM_TTS_VOICE:-}
      TELEGRAM_OGG_URL: ${TELEGRAM_OGG_URL:-}
      TELEGRAM_TTS_MODEL: ${TELEGRAM_TTS_MODEL:-}
      # bearer key for forgeloop-ai-voice (STT, TTS, speakers, convert); sent on every voice request, empty = no header
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      # bearer key for local services (the LiveKit voice agent): accepted on direct 127.0.0.1 connections only, never via Caddy
      PORTAL_SERVICE_KEY: ${PORTAL_SERVICE_KEY:-}
      # Native MiniCPM LiveKit room issuance. API secrets stay in the host .env;
      # the public URL is the existing browser-reachable self-hosted LiveKit address.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-http://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      YULIFY_STRATA_SUBAGENT_MODEL: ${YULIFY_STRATA_SUBAGENT_MODEL:-forgeloop-provider/ornith-1-5-122b-iq3-m}
      # rnnoise (default), gtcrn or off: what cleans the microphone before the VAD hears it.
      VOICE_NOISE_MODEL: ${VOICE_NOISE_MODEL:-}

volumes:
  portal-data:
    name: forgeloop-ai-yulify-data
    labels:
      forgeloop.managed: "true"
      forgeloop.project: forgeloop-ai
      forgeloop.resource: volume
